name: DevSecOps API Fuzzing (BOLA Strike)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 1' # Run every Monday at 2 AM

jobs:
  bola_strike_audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r Tools/API_Logic_Fuzzer/requirements.txt

    - name: Lint with Ruff
      run: |
        pip install ruff
        ruff check Tools/API_Logic_Fuzzer/ --output-format=github

    - name: Run BOLA Strike Analysis
      working-directory: Tools/API_Logic_Fuzzer
      run: |
        python bola_strike.py -c config.yaml --sarif results.sarif --html report.html --cef findings.cef --evidence evidence/
      env:
        # Pass secrets securely from GH Actions
        ATTACKER_TOKEN: ${{ secrets.ATTACKER_TOKEN }}
        VICTIM_TOKEN: ${{ secrets.VICTIM_TOKEN }}
        BOLA_API_KEY: ${{ secrets.BOLA_API_KEY }}

    - name: Upload SARIF file for GitHub Advanced Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: Tools/API_Logic_Fuzzer/results.sarif
        category: bola-strike-analysis

    - name: Upload HTML Executive Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bola-strike-report
        path: Tools/API_Logic_Fuzzer/report.html
